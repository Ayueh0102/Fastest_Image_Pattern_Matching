[project]
name = "fpm-py"
version = "0.1.0"
description = "Python 版本的 Fastest Image Pattern Matching，保留原理與優化策略"
readme = "README_zh-TW.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
  "opencv-python>=4.6",
  "tqdm>=4.0",
  "Pillow>=9.0"
]

[project.optional-dependencies]
gpu = [
  "torch>=2.0"
]
dev = [
  "pytest>=7.0",
  "pytest-benchmark>=4.0",
  "black>=23.0",
  "ruff>=0.4.0"
]

[project.scripts]
fpm-py = "fpm_py.cli:main"
fpm-py-gui = "fpm_py.gui:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
